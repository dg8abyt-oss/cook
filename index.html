<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cook</title>
    <!-- Favicon and Apple Touch Icon -->
    <link rel="icon" href="https://ik.imagekit.io/migbb/cook.png">
    <link rel="apple-touch-icon" href="https://ik.imagekit.io/migbb/cook.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* iOS Safe Area handling */
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* Egg Animation Styles */
        .egg-container {
            top: -150px;
        }

        .egg {
            position: relative;
        }
        
        .egg::after {
             /* Crack lines */
             content: '';
             position: absolute;
             top: 50%; left: 50%;
             width: 0; height: 0;
             border: 1px solid transparent;
             transition: all 0.1s;
        }

        .animate-drop-egg {
            animation: dropEgg 2.5s ease-in forwards;
        }

        @keyframes dropEgg {
            0% { top: -150px; transform: rotate(0deg); }
            60% { top: 60%; transform: rotate(10deg); }
            75% { top: 60%; transform: scale(1.1, 0.8) rotate(0deg); } /* Impact squash */
            85% { top: 58%; transform: scale(0.95, 1.05); } /* Bounce up */
            100% { top: 60%; transform: scale(1.2, 0.4); opacity: 0; } /* Splat and disappear */
        }

        /* Utility to hide scrollbars but keep functionality */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-stone-100 text-stone-800 font-sans h-screen overflow-hidden">

    <!-- SCREEN: INPUT -->
    <div id="screen-input" class="flex flex-col h-full">
        <div class="bg-white p-6 shadow-sm border-b border-stone-200 flex-none">
            <h1 class="text-3xl font-bold flex items-center gap-2 text-orange-500">
                <i data-lucide="chef-hat" width="32" height="32"></i>
                Cook
            </h1>
            <p class="text-stone-500 mt-1">Hands-free cooking assistant</p>
        </div>

        <div class="p-6 flex-1 overflow-y-auto no-scrollbar flex flex-col gap-6 max-w-lg mx-auto w-full">
            <div class="bg-white rounded-2xl shadow-sm p-4 border border-stone-200 flex-1 flex flex-col min-h-[300px]">
                <textarea
                    id="recipe-input"
                    class="w-full flex-1 p-4 text-lg bg-stone-50 rounded-xl border-none focus:ring-2 focus:ring-orange-300 resize-none outline-none placeholder:text-stone-400"
                    placeholder="Paste your full recipe here..."
                ></textarea>
                <div class="flex justify-end mt-2">
                    <button id="btn-paste" class="flex items-center gap-2 text-sm text-stone-500 hover:text-orange-600 transition-colors font-medium">
                        <i data-lucide="clipboard" width="16" height="16"></i> Paste from Clipboard
                    </button>
                </div>
            </div>

            <button
                id="btn-start"
                class="w-full py-4 rounded-xl text-xl font-bold shadow-lg transform transition active:scale-95 bg-stone-300 text-stone-500 cursor-not-allowed"
                disabled
            >
                Start Cooking
            </button>
            
            <div class="text-center text-xs text-stone-400 pb-6">
                Optimized for Mobile • Works best in Chrome/Safari
            </div>
        </div>
    </div>

    <!-- SCREEN: LOADING (Egg Animation) -->
    <div id="screen-loading" class="hidden fixed inset-0 bg-amber-50 flex-col items-center justify-center overflow-hidden z-50">
        <div class="relative w-full h-full flex items-center justify-center">
            <!-- Floor -->
            <div class="absolute bottom-0 w-full h-1/3 bg-amber-100 border-t-4 border-amber-200"></div>
            
            <!-- Egg Container -->
            <div id="egg-anim" class="egg-container absolute">
                <div class="egg bg-white border-4 border-gray-200 w-20 h-28 rounded-[50%_50%_50%_50%_/_60%_60%_40%_40%] shadow-lg relative z-10"></div>
                <div class="yolk hidden absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-12 h-12 bg-yellow-400 rounded-full z-20 shadow-inner"></div>
            </div>

            <div class="absolute bottom-32 text-amber-800 font-bold text-xl animate-pulse">
                Cracking the recipe...
            </div>
        </div>
    </div>

    <!-- SCREEN: COOKING -->
    <div id="screen-cooking" class="hidden fixed inset-0 bg-stone-900 text-white flex-col font-sans z-40">
        <!-- Header -->
        <div class="flex items-center justify-between p-4 bg-stone-800 border-b border-stone-700 flex-none">
            <button id="btn-exit" class="text-stone-400 text-sm font-medium hover:text-white">Exit</button>
            <div id="step-counter" class="font-mono text-stone-400 text-sm">Step 1 / 1</div>
            <button id="btn-mic-toggle" class="p-2 rounded-full transition-colors text-stone-400">
                <i data-lucide="mic-off" width="20" height="20"></i>
            </button>
        </div>

        <!-- Main Card -->
        <div class="flex-1 flex flex-col p-6 overflow-hidden relative">
            <!-- Voice Feedback -->
            <div id="voice-feedback-container" class="hidden absolute top-4 left-0 right-0 flex justify-center z-10">
                <span id="voice-feedback-text" class="bg-stone-800/90 text-stone-300 px-4 py-1 rounded-full text-sm backdrop-blur-md border border-stone-600">
                    Heard something...
                </span>
            </div>

            <div class="flex-1 flex items-center justify-center">
                <div class="w-full">
                    <h2 id="step-text" class="text-3xl md:text-5xl font-bold leading-tight text-center tracking-tight text-white drop-shadow-sm select-none">
                        <!-- Step Text Goes Here -->
                    </h2>
                </div>
            </div>
        </div>

        <!-- Controls -->
        <div class="bg-stone-800 pb-safe pt-4 px-6 rounded-t-3xl shadow-[0_-4px_20px_rgba(0,0,0,0.3)] flex-none">
            <div class="flex justify-center gap-6 mb-6 text-xs text-stone-500 font-mono uppercase tracking-widest select-none">
                <span>"Back"</span>
                <span>"Repeat"</span>
                <span>"Next"</span>
            </div>

            <div class="flex items-center justify-between gap-4 mb-8">
                <button id="btn-prev" class="flex-1 h-16 rounded-2xl bg-stone-700 hover:bg-stone-600 flex items-center justify-center text-white active:scale-95 transition-all">
                    <i data-lucide="skip-back" width="28" height="28"></i>
                </button>

                <button id="btn-repeat" class="w-20 h-20 -mt-8 rounded-full bg-orange-500 hover:bg-orange-600 flex items-center justify-center text-white shadow-lg shadow-orange-900/50 active:scale-95 transition-all border-4 border-stone-800">
                    <i data-lucide="rotate-ccw" width="32" height="32"></i>
                </button>

                <button id="btn-next" class="flex-1 h-16 rounded-2xl bg-stone-700 hover:bg-stone-600 flex items-center justify-center text-white active:scale-95 transition-all">
                    <i data-lucide="skip-forward" width="28" height="28"></i>
                </button>
            </div>
            
            <div class="h-6 w-full"></div>
        </div>
    </div>

    <script>
        // --- State Management ---
        const state = {
            steps: [],
            currentStep: 0,
            isListening: false,
            recognition: null,
            speechSynth: window.speechSynthesis,
            voices: []
        };

        // --- Elements ---
        const els = {
            screenInput: document.getElementById('screen-input'),
            screenLoading: document.getElementById('screen-loading'),
            screenCooking: document.getElementById('screen-cooking'),
            input: document.getElementById('recipe-input'),
            btnPaste: document.getElementById('btn-paste'),
            btnStart: document.getElementById('btn-start'),
            btnExit: document.getElementById('btn-exit'),
            btnPrev: document.getElementById('btn-prev'),
            btnNext: document.getElementById('btn-next'),
            btnRepeat: document.getElementById('btn-repeat'),
            btnMic: document.getElementById('btn-mic-toggle'),
            stepText: document.getElementById('step-text'),
            stepCounter: document.getElementById('step-counter'),
            eggAnim: document.getElementById('egg-anim'),
            feedbackContainer: document.getElementById('voice-feedback-container'),
            feedbackText: document.getElementById('voice-feedback-text')
        };

        // --- Initialization ---
        lucide.createIcons();

        // Load voices slightly later to ensure browser populates them
        window.speechSynthesis.onvoiceschanged = () => {
            state.voices = window.speechSynthesis.getVoices();
        };

        // Check Input Validity
        els.input.addEventListener('input', () => {
            if (els.input.value.trim().length > 0) {
                els.btnStart.disabled = false;
                els.btnStart.classList.remove('bg-stone-300', 'text-stone-500', 'cursor-not-allowed');
                els.btnStart.classList.add('bg-orange-500', 'text-white', 'hover:bg-orange-600', 'shadow-orange-200');
            } else {
                els.btnStart.disabled = true;
                els.btnStart.classList.add('bg-stone-300', 'text-stone-500', 'cursor-not-allowed');
                els.btnStart.classList.remove('bg-orange-500', 'text-white', 'hover:bg-orange-600', 'shadow-orange-200');
            }
        });

        // Paste Logic
        els.btnPaste.addEventListener('click', async () => {
            try {
                const text = await navigator.clipboard.readText();
                els.input.value = text;
                els.input.dispatchEvent(new Event('input')); // Trigger validation
            } catch (err) {
                alert("Could not access clipboard. Please paste manually.");
            }
        });

        // --- Logic: Processing ---
        els.btnStart.addEventListener('click', () => {
            const rawText = els.input.value;
            if (!rawText.trim()) return;

            // Show Loading
            els.screenInput.classList.add('hidden');
            els.screenLoading.classList.remove('hidden');
            els.screenLoading.classList.add('flex');
            
            // Trigger Animation
            els.eggAnim.classList.remove('animate-drop-egg');
            void els.eggAnim.offsetWidth; // Trigger reflow
            els.eggAnim.classList.add('animate-drop-egg');

            // Process Text
            processRecipe(rawText);

            // Wait for animation
            setTimeout(() => {
                els.screenLoading.classList.add('hidden');
                els.screenLoading.classList.remove('flex');
                
                els.screenCooking.classList.remove('hidden');
                els.screenCooking.classList.add('flex');
                
                // Initialize Cooking State
                updateCookingUI();
                startListening();
                speak(state.steps[state.currentStep]);
            }, 2500);
        });

        function processRecipe(text) {
            const rawLines = text.split(/\n+/);
            let cleanSteps = [];

            rawLines.forEach(line => {
                let trimmed = line.trim();
                trimmed = trimmed.replace(/^[\d\-\.\)]+\s*/, ''); // Remove numbering
                if (trimmed.length > 0) {
                    cleanSteps.push(trimmed);
                }
            });

            if (cleanSteps.length <= 1 && text.length > 50) {
                 // Fallback to sentence splitting
                 cleanSteps = text.match(/[^\.!\?]+[\.!\?]+/g) || [text];
                 cleanSteps = cleanSteps.map(s => s.trim());
            }

            state.steps = cleanSteps;
            state.currentStep = 0;
        }

        // --- Logic: Navigation ---
        function updateCookingUI() {
            els.stepText.textContent = state.steps[state.currentStep];
            els.stepCounter.textContent = `Step ${state.currentStep + 1} / ${state.steps.length}`;
            
            // Update Next Button Icon based on state
            const nextIconContainer = els.btnNext;
            if (state.currentStep === state.steps.length - 1) {
                nextIconContainer.innerHTML = '<span class="font-bold">DONE</span>';
            } else {
                nextIconContainer.innerHTML = '<i data-lucide="skip-forward" width="28" height="28"></i>';
                lucide.createIcons();
            }
        }

        function nextStep() {
            if (state.currentStep < state.steps.length - 1) {
                state.currentStep++;
                updateCookingUI();
                speak(state.steps[state.currentStep]);
            } else {
                speak("You have finished the recipe! Bon appétit.");
            }
        }

        function prevStep() {
            if (state.currentStep > 0) {
                state.currentStep--;
                updateCookingUI();
                speak(state.steps[state.currentStep]);
            } else {
                speak("This is the first step.");
            }
        }

        function repeatStep() {
            speak(state.steps[state.currentStep]);
        }

        els.btnNext.addEventListener('click', nextStep);
        els.btnPrev.addEventListener('click', prevStep);
        els.btnRepeat.addEventListener('click', repeatStep);

        els.btnExit.addEventListener('click', () => {
            stopListening();
            state.speechSynth.cancel();
            els.screenCooking.classList.add('hidden');
            els.screenCooking.classList.remove('flex');
            els.screenInput.classList.remove('hidden');
            els.input.value = '';
            els.input.dispatchEvent(new Event('input')); // Reset button state
        });

        // --- Logic: Text to Speech ---
        function speak(text) {
            state.speechSynth.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 0.9;
            utterance.pitch = 1;

            // Try to find a good voice
            const voices = state.voices.length ? state.voices : window.speechSynthesis.getVoices();
            const preferredVoice = voices.find(v => v.name.includes('Samantha') || v.name.includes('Google US English'));
            if (preferredVoice) utterance.voice = preferredVoice;

            state.speechSynth.speak(utterance);
        }

        // --- Logic: Speech Recognition ---
        function startListening() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) return;

            state.recognition = new SpeechRecognition();
            state.recognition.continuous = true;
            state.recognition.interimResults = false;
            state.recognition.lang = 'en-US';

            state.recognition.onstart = () => {
                state.isListening = true;
                updateMicIcon();
            };
            
            state.recognition.onend = () => {
                state.isListening = false;
                updateMicIcon();
                // Auto restart if supposedly still listening in app state (optional, can be annoying)
            };

            state.recognition.onresult = (event) => {
                const transcript = event.results[event.results.length - 1][0].transcript.trim().toLowerCase();
                showFeedback(`"${transcript}"`);
                
                if (transcript.includes('next') || transcript.includes('done') || transcript.includes('okay')) {
                    nextStep();
                } else if (transcript.includes('back') || transcript.includes('previous')) {
                    prevStep();
                } else if (transcript.includes('repeat') || transcript.includes('again') || transcript.includes('what')) {
                    setTimeout(() => speak(state.steps[state.currentStep]), 200);
                }
            };

            try {
                state.recognition.start();
            } catch(e) {
                console.error("Mic start error", e);
            }
        }

        function stopListening() {
            if (state.recognition) {
                state.recognition.stop();
            }
            state.isListening = false;
            updateMicIcon();
        }

        function toggleListening() {
            if (state.isListening) {
                stopListening();
            } else {
                startListening();
            }
        }

        els.btnMic.addEventListener('click', toggleListening);

        function updateMicIcon() {
            if (state.isListening) {
                els.btnMic.innerHTML = '<i data-lucide="mic" width="20" height="20"></i>';
                els.btnMic.classList.add('bg-red-500/20', 'text-red-500');
                els.btnMic.classList.remove('text-stone-400');
            } else {
                els.btnMic.innerHTML = '<i data-lucide="mic-off" width="20" height="20"></i>';
                els.btnMic.classList.remove('bg-red-500/20', 'text-red-500');
                els.btnMic.classList.add('text-stone-400');
            }
            lucide.createIcons();
        }

        function showFeedback(text) {
            els.feedbackText.textContent = text;
            els.feedbackContainer.classList.remove('hidden');
            setTimeout(() => {
                els.feedbackContainer.classList.add('hidden');
            }, 2000);
        }

    </script>
</body>
</html>
